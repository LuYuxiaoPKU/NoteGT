# Done to increase the memory available to gradle.
# Proxy: this machine routes external traffic via 127.0.0.1:7897 (Java does not
# read the WinINET system proxy, so it must be spelled out here + JAVA_TOOL_OPTIONS).
org.gradle.jvmargs=-Xmx2G -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=7897 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=7897
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
version=0.1.0
group=com.notegt

# Dependencies
fabric_api_version=0.141.6+1.21.11
