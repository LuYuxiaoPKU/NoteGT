# Build the Fabric mod (notesoundopt/) on every push and pull request.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: notesoundopt
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
        with:
          path: notesoundopt

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        # 代理纪律（2026-09-13 根因）：gradle.properties 的 jvmargs 不得写 127.0.0.1 本地代理（runner 无此代理）。
        run: ./gradlew build

      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: notesoundopt/build/libs/
