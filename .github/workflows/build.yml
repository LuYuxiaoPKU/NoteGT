# Build the Fabric mod (notesoundopt/) on every push and pull request.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: notesoundopt
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
        with:
          path: notesoundopt

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: diagnose fabric maven connectivity
        run: |
          echo '--- DNS ---'
          getent hosts maven.fabricmc.net || true
          echo '--- curl marker pom (1.17.20) ---'
          curl -sS -o /dev/null -w 'http=%{http_code} time=%{time_total}s\n' \
            'https://maven.fabricmc.net/net/fabricmc/fabric-loom-remap/net.fabricmc.fabric-loom-remap.gradle.plugin/1.17.20/net.fabricmc.fabric-loom-remap.gradle.plugin-1.17.20.pom' || true
          echo '--- curl maven-metadata (first 8 lines) ---'
          curl -sS 'https://maven.fabricmc.net/net/fabricmc/fabric-loom-remap/net.fabricmc.fabric-loom-remap.gradle.plugin/maven-metadata.xml' | head -8 || true
          echo '--- curl maven central (control) ---'
          curl -sS -o /dev/null -w 'http=%{http_code}\n' 'https://repo1.maven.org/maven2/org/slf4j/slf4j-api/maven-metadata.xml' || true

      - name: build
        run: ./gradlew build

      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: notesoundopt/build/libs/
